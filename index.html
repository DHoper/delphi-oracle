<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060508">
<title>神諭塔羅</title>
<meta name="description" content="夜裡登上德爾菲神殿，走進內殿，在巨蟒皮同的凝視下抽出塔羅牌，聽女祭司為你解牌。">
<!-- 分享預覽（LINE、Facebook、Threads、Discord 等抓這幾行）；網址以 GitHub Pages 為準 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="神諭塔羅">
<meta property="og:title" content="神諭塔羅">
<meta property="og:description" content="寫下你想問的事，從火中取一枚預兆，在巨蟒皮同的凝視下抽出你的牌。">
<meta property="og:url" content="https://dhoper.github.io/delphi-oracle/">
<meta property="og:image" content="https://dhoper.github.io/delphi-oracle/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<link rel="artifact-thumbnail" href="thumb.jpg">
<link rel="preload" as="image" href="assets/gate/gate-portrait.webp" media="(max-aspect-ratio: 11/10)">
<link rel="preload" as="image" href="assets/gate/gate-wide.webp" media="(min-aspect-ratio: 11/10)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=6d8e4232">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="heat" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.045" numOctaves="2" seed="3" result="n"/>
    <feOffset in="n" dy="0" result="m"><animate attributeName="dy" from="0" to="-220" dur="3.2s" repeatCount="indefinite"/></feOffset>
    <feTile in="m" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="stage intro-on" id="stage" data-phase="ask">

  <!-- 遠景：神殿後牆與門楣 -->
  <!-- 內殿全景：神殿、巨蟒皮同、火盆、地縫與石桌出自同一張圖；手機用直幅、寬螢幕用橫幅
       眼瞼另疊一層（同一張圖重繪成閉眼版，只取雙眼周圍），火星與地縫煙霧由程式疊在畫上的火盆與地縫 -->
  <div class="serpent scene" id="serpent">
    <img class="body" id="sceneImg" src="assets/sanctum/temple-portrait.webp" alt="">
    <canvas class="gl" id="sceneGL" aria-hidden="true"></canvas>
    <img class="lids" id="sceneLids" src="assets/sanctum/lids-portrait.webp" alt="" aria-hidden="true">
    <i class="anc anc-l" data-fire="sparks"></i><i class="anc anc-r" data-fire="sparks"></i><i class="anc anc-fis" id="fissure"></i>
    <div class="head" id="head" data-eye="open" hidden></div>
  </div>

  <div class="layer" data-depth="0.035">
    <img class="pythia" id="pythia" src="assets/sanctum/pythia.webp" alt="">
  </div>

  <canvas class="fx" id="smoke" aria-hidden="true"></canvas>

  <canvas class="fx" id="serpentBack" hidden></canvas>
  <canvas class="fx" id="serpentFront" hidden></canvas>

  <!-- 石桌：雙手、牌位、牌堆、牌扇 -->
  <div class="table" id="table">
    <div id="hands" hidden></div>
    <div class="gaze" id="gaze" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="slots" id="slots"></div>
  </div>
  <div class="cards" id="cards"></div>

  <canvas class="fx" id="fire" aria-hidden="true"></canvas>

  <div class="knock" id="knock" hidden>
    <p class="knock-count" id="knockCount" aria-live="polite"></p>
    <button type="button" class="knock-skip" id="knockSkip" hidden>略過，直接看解讀</button>
  </div>

  <!-- 神諭之聲 -->
  <p class="utter" id="utter" aria-live="polite"></p>

  <!-- 介面 -->
  <header class="top">
    <a class="brand" href="./">神諭塔羅</a>
    <div class="tools">
      <button type="button" class="icon" id="sound" aria-pressed="false" aria-label="音效" title="音效"></button>
    </div>
  </header>

  <!-- 求問：一次只做一件事。一、自火中取預兆　二、擇牌陣　三、刻下問題，按住封印獻上 -->
  <form class="rite" id="ask" autocomplete="off" data-step="0">
    <!-- 祭壇之火：畫中石桌就是祭壇，火由粒子拼成，預兆投進這裡；整場儀式都燃著 -->
    <div class="brazier altar" id="brazier"><i class="flame" data-fire="altar" aria-hidden="true"></i></div>
    <!-- 求問三步：一、叩問（道出所問）　二、自火中取預兆　三、命運三女神垂目（擇牌陣），按住封印獻上 -->
    <section class="step" data-step="0" aria-label="叩問"></section>
    <section class="step" data-step="1" aria-label="自火中取一預兆">
      <div class="omens" id="omens" role="listbox" aria-label="預兆"></div>
    </section>
    <section class="step" data-step="2" aria-label="命運三女神選定牌陣，獻上所問">
      <button type="button" class="seal" id="seal" aria-label="按住封印，獻上所問" disabled></button>
    </section>
    <p class="cap" id="stepCap" aria-live="polite"></p>
    <nav class="steps" id="steps" aria-label="步驟"></nav>
  </form>
  <!-- 擇牌陣：命運女神的目光落於何處——四枚星象徽記 -->
  <div class="sigils" id="sigils" role="radiogroup" aria-label="命運三女神將看向何處"></div>
  <!-- 道出所問：刻在石上的一行字，可留白；最多 60 字 -->
  <div class="askq" id="askq">
    <label class="vh" for="question">你想問的事</label>
    <textarea id="question" class="inscribe" maxlength="60" rows="2" placeholder="寫下你想問的事，例如：這份工作該換嗎" autocomplete="off" enterkeyhint="done"></textarea>
    <p class="askq-need" id="qNeed" hidden>先寫下你想問的事，女祭司才能為你解讀</p>
    <p class="askq-meta"><span class="askq-count" id="qCount" aria-hidden="true">0／60</span><span class="askq-quota" id="qQuota"></span></p>
    <button type="button" class="b-main" id="askGo">叩問</button>
  </div>
  <div class="offering" id="offering" aria-hidden="true"></div>
  <p class="whisper out" id="whisper" aria-live="polite"></p>
  <p class="cuthint" id="cutHint" hidden>切牌：隨心點一疊</p>

  <p class="hint" id="hint" role="status" aria-live="polite"></p>
  <button type="button" class="flipall" id="flipAll" hidden>全部翻開</button>

  <section class="scroll" id="reading" aria-label="神諭解讀" hidden>
    <div class="scroll-in" id="readingIn"></div>
  </section>
</div>

<!-- 看牌：點牌即可看大圖 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="牌面大圖" hidden>
  <figure><div class="lb-card" id="lbCard"></div><figcaption id="lbCap"></figcaption></figure>
  <button type="button" class="share-close" data-close>收起</button>
</div>

<!-- 神力耗盡等提示 -->
<div class="notice" id="notice" role="alertdialog" aria-modal="true" aria-labelledby="noticeTitle" hidden>
  <div class="notice-in">
    <h2 id="noticeTitle"></h2>
    <p id="noticeBody"></p>
    <button type="button" class="b-main" data-close>領受</button>
  </div>
</div>

<!-- 分享：神諭圖卡＋各種分享方式 -->
<div class="share" id="share" role="dialog" aria-modal="true" aria-labelledby="shareTitle" hidden>
  <div class="share-in">
    <h2 id="shareTitle">傳出這則神諭</h2>
    <div class="share-card"><img id="shareImg" alt="神諭圖卡"><i class="share-wait" aria-hidden="true"></i></div>
    <div class="share-side">
      <p class="share-preview" id="sharePreview"></p>
      <label class="share-q" id="shareQ" hidden><input type="checkbox" id="shareQChk"><i aria-hidden="true"></i>附上你的問題</label>
      <p class="share-tip">長圖收錄女祭司之言全文與牌上的故事，可上下捲動預覽；連結在 LINE、Facebook 上會顯示這則神諭的讖語與牌</p>
    <div class="share-acts">
      <button type="button" class="b-main" data-act="native">分享圖片與連結</button>
      <button type="button" class="b-main" data-act="copyimg" hidden>複製長圖</button>
      <button type="button" data-act="save">存下長圖</button>
      <button type="button" data-act="link">複製連結</button>
      <button type="button" data-act="line">LINE</button>
      <button type="button" data-act="facebook">Facebook</button>
      <button type="button" data-act="threads">Threads</button>
      <button type="button" class="share-story" data-act="story">另存限時動態版（9:16）</button>
    </div>
    <p class="share-status" id="shareStatus" role="status" aria-live="polite"></p>
    </div>
    <button type="button" class="share-close" data-close>收起</button>
  </div>
</div>

<!-- 進入畫面：山巒上的德爾菲神殿。門口的帷幕就是入口——撥開它，走進內殿 -->
<div class="intro" id="intro">
  <div class="gate" id="gate">
    <img class="gate-img" alt="" draggable="false">
    <div class="door" role="button" aria-label="撥開帷幕，走入神殿">
      <div class="door-glow"></div>
      <div class="curtain l"></div><div class="curtain r"></div>
    </div>
  </div>
  <div class="intro-flash" aria-hidden="true"></div>
  <header class="intro-head">
    <p class="intro-greek" aria-hidden="true">ΓΝΩΘΙ ΣΑΥΤΟΝ</p>
    <h1 class="intro-title">神諭塔羅</h1>
    <p class="intro-sub" aria-hidden="true">ORACLE TAROT · DELPHI</p>
    <div class="intro-load" id="introLoad" role="progressbar" aria-label="點燃火盆" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="introBar"></i></div>
  </header>
  <div class="intro-foot">
    <div class="intro-body" id="introBody">
      <p class="intro-line">內殿的火未熄，巨蟒皮同仍在凝視。</p>
    </div>
    <p class="intro-hint" aria-hidden="true">撥開帷幕</p>
    <button type="button" class="b-sub" id="enterAlt" hidden disabled></button>
    <p class="intro-note">神殿裡有聲音；點右上角的里拉琴就能關掉</p>
  </div>
  <button type="button" class="intro-skip" id="introSkip" hidden>直接入殿</button>
</div>

<div class="rotate" aria-hidden="true"><p>請將裝置轉為直向，再走入神殿</p></div>

<noscript><p style="color:#fff;padding:2em">需要開啟 JavaScript，神殿的門才打得開。</p></noscript>

<script type="module" src="js/main.js?v=0b53a648"></script>
</body>
</html>
