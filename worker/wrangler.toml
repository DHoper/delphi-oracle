name = "delphi-oracle-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# 允許呼叫的網站來源（逗號分隔）；localhost 一律放行，方便本機測試
ALLOWED_ORIGINS = "https://dhoper.github.io"
MODEL = "deepseek-flash"
# 每日上限（台灣時間午夜重置）：免費網站，為節省成本
DAILY_PER_USER = "5"
DAILY_SITE = "100"
# 求問者寫下的問題最多幾個字
QUESTION_MAX = "60"

# 每個 IP 每 60 秒最多 6 次（防連點、防腳本）
[[ratelimits]]
name = "RL"
namespace_id = "2611"
simple = { limit = 6, period = 60 }

# 每日次數計數（鍵：日期＋IP 雜湊、日期＋全站），兩天後自動過期
[[kv_namespaces]]
binding = "QUOTA"
id = "ffd986b626a94aba97534849c86a715c"

# 金鑰不寫在這裡：npx wrangler secret put DEEPSEEK_API_KEY
